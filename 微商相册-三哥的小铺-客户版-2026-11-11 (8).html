<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三哥的小铺 · 商品目录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A1C1E'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2' fill='none' stroke='%23F5F4F0' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%23B23A2E' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F5F4F0;
  --paper-2:#EDEBE5;
  --card:#FFFFFF;
  --ink:#1A1C1E;
  --ink-2:#54585C;
  --ink-3:#8C9095;
  --line:#E1DFD9;
  --line-2:#D3D0C9;
  --accent:#B23A2E;
  --green:#2F6B4F;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun","Georgia",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
}

/* ================= 客户端：顾客浏览的商品目录（独立样式，不含店主版任何规则） ================= */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,p,ul{margin:0}
img{display:block;max-width:100%}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit}
.c-head{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.c-in{max-width:1240px;margin:0 auto;padding:20px 20px 0}
.c-brand{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:16px}
.c-shop{font-family:var(--serif);font-size:clamp(23px,2.2vw,30px);font-weight:600;line-height:1.2;letter-spacing:.02em}
.c-sub{margin-top:7px;font-size:12.5px;color:var(--ink-3);letter-spacing:.03em}
.c-wx{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;background:var(--ink);color:#fff;border-radius:2px;font-size:12.5px;letter-spacing:.02em;max-width:240px;flex:0 0 auto}
.c-wx[hidden]{display:none}
.c-wx:hover{opacity:.88}
.c-wx svg{width:15px;height:15px;stroke:#fff;flex:0 0 auto}
.c-acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.c-selfqr{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border:1px solid var(--line-2);color:var(--ink-2);border-radius:2px;font-size:12.5px;letter-spacing:.02em}
.c-selfqr svg{width:15px;height:15px;stroke:var(--ink-2)}
.c-selfqr:hover{border-color:var(--ink);color:var(--ink)}
.c-selfqr[hidden]{display:none}
.c-wx-id{font-size:11.5px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-bar{display:flex;align-items:center;gap:16px;padding-bottom:14px}
.c-chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:2px 0;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 20px),transparent)}
.c-chips::-webkit-scrollbar{display:none}
.c-chip{flex:0 0 auto;height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:2px;background:transparent;font-size:13px;color:var(--ink-2);transition:background .18s,color .18s,border-color .18s}
.c-chip:hover{border-color:var(--ink-3);color:var(--ink)}
.c-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.c-chip em{font-style:normal;font-size:11px;opacity:.62;margin-left:5px}
.c-search{display:flex;align-items:center;gap:8px;width:210px;height:40px;padding:0 11px;border:1px solid var(--line-2);border-radius:2px;background:var(--card);flex:0 0 auto}
.c-search svg{width:15px;height:15px;stroke:var(--ink-3);flex:0 0 auto}
.c-search input{width:100%;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:var(--ink)}
.c-main{max-width:1240px;margin:0 auto;padding:26px 20px 44px}
.c-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 14px}
.c-card{display:block;width:100%;min-width:0;text-align:left;cursor:pointer}
.c-card:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.c-thumb{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--paper-2)}
.c-thumb img{width:100%;height:100%;object-fit:cover;transition:opacity .22s}
.c-card:hover .c-thumb img{opacity:.93}
.c-flag{position:absolute;top:0;left:0;background:rgba(26,28,30,.8);color:#fff;font-size:11.5px;padding:4px 9px;letter-spacing:.08em}
.c-num-pic{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.92);color:var(--ink-2);font-size:11px;padding:3px 7px;letter-spacing:.02em}
.c-name{font-size:15px;font-weight:600;margin-top:11px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-prow{margin-top:6px;display:flex;align-items:baseline;gap:2px}
.c-cny{font-size:12px;color:var(--accent)}
.c-amt{font-family:var(--serif);font-size:21px;color:var(--accent);line-height:1;letter-spacing:.01em}
.c-was{margin-left:7px;font-size:11.5px;color:var(--ink-3);text-decoration:line-through}
.c-ask{font-size:14px;color:var(--ink-2);letter-spacing:.04em}
.c-meta{margin-top:5px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.c-card.sold .c-cny,.c-card.sold .c-amt{color:var(--ink-3)}
.c-empty{padding:66px 0 10px;text-align:center}
.c-empty svg{width:54px;height:54px;margin:0 auto 16px;stroke:var(--ink-3);opacity:.55}
.c-empty h2{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink-2)}
.c-empty p{margin-top:8px;font-size:13px;color:var(--ink-3)}
.c-foot{display:flex;justify-content:space-between;gap:12px;margin-top:46px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3);letter-spacing:.03em}
/* 商品详情 */
.c-veil{position:fixed;inset:0;z-index:40;background:rgba(24,20,16,.4);opacity:0;pointer-events:none;transition:opacity .26s}
.c-veil.on{opacity:1;pointer-events:auto}
.c-qr{position:fixed;inset:0;z-index:44;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .24s}
.c-qr.open{opacity:1;pointer-events:auto}
.c-qr-in{width:min(322px,88vw);background:var(--paper);border:1px solid var(--line);box-shadow:0 30px 70px -30px rgba(0,0,0,.45);transform:translateY(10px);transition:transform .28s cubic-bezier(.2,.8,.25,1)}
.c-qr.open .c-qr-in{transform:none}
.c-qr-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.c-qr-tag{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.02em}
.c-qr-x{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center}
.c-qr-x svg{width:16px;height:16px;stroke:var(--ink-2)}
.c-qr-body{padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.c-qr-img{width:188px;height:188px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:6px}
.c-qr-hint{font-size:12px;color:var(--ink-3);line-height:1.6}
.c-qr-wx{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink-3)}
.c-qr-wx b{font-size:14px;color:var(--ink);font-weight:600;letter-spacing:.02em}
.c-qr .c-btn.ghost{width:100%;height:40px;margin-top:2px}
.c-view{position:fixed;inset:0;z-index:42;display:flex;align-items:center;justify-content:center;background:transparent;opacity:0;pointer-events:none;transform:translateY(18px);transition:opacity .28s,transform .3s cubic-bezier(.2,.8,.25,1)}
.c-view.open{opacity:1;pointer-events:auto;transform:none}
.c-view-in{display:flex;flex-direction:column;width:100%;height:100%;max-width:680px;background:var(--paper);overflow:hidden}
.c-view-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--paper);padding-top:calc(12px + env(safe-area-inset-top))}
.c-back{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 8px 0 0;font-size:13px;color:var(--ink-2);letter-spacing:.02em}
.c-back svg{width:17px;height:17px;stroke:var(--ink-2)}
.c-view-tag{font-size:11.5px;color:var(--ink-3);letter-spacing:.16em}
.c-view-pad{width:52px}
.c-view-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.c-gal{background:var(--paper)}
.c-stage{position:relative;width:fit-content;max-width:100%;margin:0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper-2)}
.c-stage img{display:block;max-width:100%;max-height:48vh;width:auto;height:auto;object-fit:contain}
.c-ths{display:flex;gap:8px;padding:10px 18px 12px;overflow-x:auto;background:var(--paper)}
.c-th{width:46px;height:46px;flex:0 0 auto;border:1px solid transparent;overflow:hidden;background:var(--paper-2)}
.c-th.on{border-color:var(--ink)}
.c-th img{width:100%;height:100%;object-fit:cover}
.c-inf{padding:20px 18px 10px}
.c-pname{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.34;letter-spacing:.01em}
.c-dprow{display:flex;align-items:baseline;margin-top:12px;gap:2px}
.c-dcny{font-size:14px;color:var(--accent)}
.c-dnum{font-family:var(--serif);font-size:32px;color:var(--accent);line-height:1;letter-spacing:.01em}
.c-dold{margin-left:10px;font-size:12px;color:var(--ink-3);text-decoration:line-through}
.c-dprow.ask .c-dcny,.c-dprow.ask .c-dold{display:none}
.c-dprow.ask .c-dnum{font-size:22px;color:var(--ink-2)}
.c-dprow.sold .c-dcny,.c-dprow.sold .c-dnum{color:var(--ink-3)}
.c-line{margin-top:12px;font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}
.c-desc{margin-top:16px;font-size:14px;line-height:1.85;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.c-note{margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.c-cta{display:flex;gap:10px;padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);flex:0 0 auto}
.c-btn{flex:1;height:44px;border-radius:2px;font-size:14px;letter-spacing:.02em}
.c-btn[hidden]{display:none}
.c-btn.ghost{border:1px solid var(--line-2);color:var(--ink-2)}
.c-btn.ghost:hover{background:var(--paper-2)}
.c-btn.dark{background:var(--ink);color:#fff}
.c-btn.dark:hover{opacity:.88}
.c-toast{position:fixed;left:50%;bottom:84px;z-index:60;transform:translate(-50%,10px);background:rgba(26,28,30,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){
  .c-grid{grid-template-columns:repeat(3,1fr);gap:34px 24px}
  .c-view{background:rgba(24,20,16,.4);padding:28px}
  .c-view-in{height:auto;max-width:820px;max-height:calc(100% - 56px);border:1px solid var(--line);box-shadow:0 30px 70px -30px rgba(0,0,0,.4)}
  .c-view-bar{padding-top:12px}
}
@media (min-width:760px){
  .c-view-body{display:flex;align-items:stretch;min-height:0}
  .c-gal{flex:0 0 46%;display:flex;flex-direction:column;height:min(58vh,540px);background:var(--paper-2)}
  .c-stage{flex:1;min-height:0;width:100%;max-width:none;margin:0;background:var(--paper-2)}
  .c-stage img{width:100%;height:100%;max-height:none;max-width:none;object-fit:contain}
  .c-ths{flex:0 0 auto;background:var(--paper);padding:12px 16px}
  .c-inf{flex:1;min-width:0;padding:26px 26px 18px}
  .c-pname{font-size:24px}
  .c-dnum{font-size:36px}
  .c-desc{margin-top:18px}
}
@media (min-width:1100px){
  .c-grid{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:699px){
  .c-in{padding:16px 14px 0}
  .c-brand{gap:10px;padding-bottom:12px}
  .c-shop{font-size:22px}
  .c-wx{height:34px;padding:0 11px;font-size:12px}
  .c-wx-id{display:none}
  .c-bar{flex-direction:column;align-items:stretch;gap:10px;padding-bottom:12px}
  .c-search{width:100%}
  .c-main{padding:18px 14px 30px}
  .c-grid{gap:20px 12px}
  .c-name{font-size:14px;margin-top:9px}
  .c-amt{font-size:19px}
  .c-foot{margin-top:32px}
}

</style>
</head>
<body>

<header class="c-head">
  <div class="c-in">
    <div class="c-brand">
      <div>
        <h1 class="c-shop" id="cShop"></h1>
        <p class="c-sub" id="cSub"></p>
      </div>
      <div class="c-acts">
        <button class="c-selfqr" id="cSelfQr" hidden aria-label="本页二维码">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h3v3M20 20h1M16 20v1"/></svg>
          <span>二维码</span>
        </button>
        <button class="c-wx" id="cWx" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10.9c0 4-4 7.3-9 7.3-1 0-2-.1-2.9-.4L5 19.4l.8-3.2C4.3 14.7 3 12.9 3 10.9C3 6.9 7 3.6 12 3.6s9 3.3 9 7.3z"/><circle cx="8.7" cy="10.7" r="1"/><circle cx="15.3" cy="10.7" r="1"/></svg>
          <span>微信咨询</span>
          <span class="c-wx-id" id="cWxId"></span>
        </button>
      </div>
    </div>
    <div class="c-bar">
      <div class="c-chips" id="cChips"></div>
      <label class="c-search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l4 4"/></svg>
        <input id="cSearch" type="search" placeholder="搜索商品" autocomplete="off">
      </label>
    </div>
  </div>
</header>

<main class="c-main">
  <div class="c-grid" id="cGrid"></div>
  <div class="c-empty" id="cEmpty" hidden>
    <svg viewBox="0 0 64 64" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="16" width="48" height="36" rx="2"/><path d="M14 22h8v8h-8z"/><circle cx="32" cy="33" r="8"/><path d="M26 30.5h6"/>
    </svg>
    <h2 id="cEmptyT">还没有商品</h2>
    <p id="cEmptyP">店主上新后会出现在这里。</p>
  </div>
  <div class="c-foot"><span id="cFootL"></span><span id="cFootR"></span></div>
</main>

<div class="c-veil" id="cVeil"></div>
<section class="c-view" id="cView" role="dialog" aria-modal="true" aria-label="商品详情">
  <div class="c-view-in">
    <div class="c-view-bar">
      <button class="c-back" id="cBack"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M14.5 5l-7 7 7 7"/></svg><span>返回</span></button>
      <span class="c-view-tag">商品详情</span>
      <span class="c-view-pad"></span>
    </div>
    <div class="c-view-body">
      <div class="c-gal">
        <div class="c-stage" id="cStage"><img id="cImg" alt=""></div>
        <div class="c-ths" id="cThs"></div>
      </div>
      <div class="c-inf">
        <h2 class="c-pname" id="cName"></h2>
        <div class="c-dprow" id="cDpRow"><span class="c-dcny">¥</span><span class="c-dnum" id="cDp"></span><span class="c-dold" id="cDold"></span></div>
        <p class="c-line" id="cLine"></p>
        <p class="c-desc" id="cDesc"></p>
        <p class="c-note" id="cNote"></p>
      </div>
    </div>
    <div class="c-cta">
      <button class="c-btn ghost" id="cCopy">复制商品信息</button>
      <button class="c-btn dark" id="cAsk" hidden>微信咨询</button>
    </div>
  </div>
</section>

<div class="c-veil" id="cQrVeil"></div>
<section class="c-qr" id="cQr" role="dialog" aria-modal="true" aria-label="微信咨询">
  <div class="c-qr-in">
    <div class="c-qr-bar">
      <span class="c-qr-tag">微信咨询</span>
      <button class="c-qr-x" id="cQrX" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="c-qr-body">
      <img class="c-qr-img" id="cQrImg" alt="店主微信二维码" hidden>
      <p class="c-qr-hint" id="cQrHint" hidden>用微信扫一扫；手机上长按图片可直接识别</p>
      <div class="c-qr-wx" id="cQrWxRow">
        <span>微信号</span><b id="cQrWx"></b>
      </div>
      <button class="c-btn ghost" id="cQrCopy">复制微信号</button>
    </div>
  </div>
</section>

<div class="c-veil" id="cSelfVeil"></div>
<section class="c-qr" id="cSelf" role="dialog" aria-modal="true" aria-label="本页二维码">
  <div class="c-qr-in">
    <div class="c-qr-bar">
      <span class="c-qr-tag">本页二维码</span>
      <button class="c-qr-x" id="cSelfX" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="c-qr-body">
      <img class="c-qr-img" id="cSelfImg" alt="本页二维码">
      <p class="c-qr-hint">扫码打开这个相册；手机上长按图片可保存或转发</p>
      <button class="c-btn ghost" id="cSelfSave">保存二维码图片</button>
    </div>
  </div>
</section>
<div class="c-toast" id="cToast"></div>

<script>

/**
 * Minified by jsDelivr using Terser v5.37.0.
 * Original file: /npm/qrcode-generator@1.4.4/qrcode.js
 *

<script>

(function () {
  var D = window.__SHARE__ || { items: [] };
  var items = (D.items || []).slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
  var cat = '全部', q = '', cur = null, idx = 0;
  var NOIMG = D.noimg || '';
  function $(s) { return document.querySelector(s); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function num(v) { if (v === '' || v == null) return ''; var n = Number(v); return isNaN(n) ? '' : Math.round(n * 100) / 100; }
  function fmt(v) { var n = num(v); return n === '' ? '' : n.toLocaleString('zh-CN', { maximumFractionDigits: 2 }); }
  function catOf(it) { return (it.cat && it.cat.trim()) || '未分类'; }
  var tTimer;
  function toast(m) { var t = $('#cToast'); t.textContent = m; t.classList.add('show'); clearTimeout(tTimer); tTimer = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function copyText(text, okMsg) {
    function done(r) { toast(r ? okMsg : '复制失败，请长按文字手动复制'); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
      return;
    }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      done(ok);
    } catch (e) { done(false); }
  }
  function priceHtml(it) {
    if (num(it.price) === '') return '<p class="c-prow"><span class="c-ask">价格面议</span></p>';
    return '<p class="c-prow"><span class="c-cny">¥</span><span class="c-amt">' + fmt(it.price) + '</span>' +
      (num(it.oldPrice) !== '' ? '<span class="c-was">¥' + fmt(it.oldPrice) + '</span>' : '') + '</p>';
  }
  function card(it) {
    var imgs = it.images || [];
    var meta = [];
    if (it.cat) meta.push(esc(it.cat));
    if (num(it.stock) !== '') meta.push('库存 ' + Number(it.stock));
    return '<article class="c-card' + (it.sold ? ' sold' : '') + '" data-id="' + esc(it.id) + '" tabindex="0" role="button">' +
      '<div class="c-thumb"><img src="' + (imgs[0] || NOIMG) + '" alt="' + esc(it.title) + '" loading="lazy">' +
      (imgs.length > 1 ? '<span class="c-num-pic">' + imgs.length + ' 图</span>' : '') +
      (it.sold ? '<span class="c-flag">已售</span>' : '') + '</div>' +
      '<h3 class="c-name">' + esc(it.title) + '</h3>' + priceHtml(it) +
      (meta.length ? '<p class="c-meta">' + meta.join(' · ') + '</p>' : '') + '</article>';
  }
  function visible() {
    var s = q.trim().toLowerCase();
    return items.filter(function (it) {
      if (cat !== '全部' && catOf(it) !== cat) return false;
      if (!s) return true;
      return [it.title, it.cat, it.desc].some(function (v) { return String(v == null ? '' : v).toLowerCase().indexOf(s) >= 0; });
    });
  }
  function chips() {
    var list = [{ n: '全部', c: items.length }];
    var seen = {};
    items.forEach(function (it) {
      var c = catOf(it);
      if (!seen[c]) { seen[c] = 1; list.push({ n: c, c: 0 }); }
    });
    list.forEach(function (t) {
      if (t.n === '全部') return;
      t.c = items.filter(function (it) { return catOf(it) === t.n; }).length;
    });
    if (cat !== '全部' && !seen[cat]) cat = '全部';
    $('#cChips').innerHTML = list.map(function (t) {
      return '<button class="c-chip' + (t.n === cat ? ' on' : '') + '" data-cat="' + esc(t.n) + '">' + esc(t.n) + '<em>' + t.c + '</em></button>';
    }).join('');
  }
  function render() {
    chips();
    var list = visible();
    $('#cGrid').innerHTML = list.map(card).join('');
    $('#cEmpty').hidden = list.length > 0;
    if (!list.length) {
      $('#cEmptyT').textContent = items.length ? '没有找到相关商品' : '还没有商品';
      $('#cEmptyP').textContent = items.length ? '换个关键词，或点「全部」看看。' : '店主上新后会出现在这里。';
    }
    $('#cFootR').textContent = '共 ' + items.length + ' 件';
    $('#cFootL').textContent = '商品目录' + (D.built ? ' · ' + D.built : '');
  }
  function find(id) {
    for (var i = 0; i < items.length; i++) { if (items[i].id === id) return items[i]; }
    return null;
  }
  function renderDetail() {
    var it = find(cur);
    if (!it) return;
    var imgs = it.images || [];
    if (idx > imgs.length - 1) idx = 0;
    $('#cImg').src = imgs.length ? imgs[idx] : NOIMG;
    $('#cImg').alt = it.title;
    $('#cThs').hidden = imgs.length < 2;
    $('#cThs').innerHTML = imgs.length > 1 ? imgs.map(function (s2, i) {
      return '<button class="c-th' + (i === idx ? ' on' : '') + '" data-i="' + i + '"><img src="' + s2 + '" alt=""></button>';
    }).join('') : '';
    $('#cName').textContent = it.title;
    var row = $('#cDpRow');
    var p = num(it.price);
    row.classList.toggle('ask', p === '');
    row.classList.toggle('sold', !!it.sold);
    $('#cDp').textContent = p === '' ? '价格面议' : fmt(p);
    var old = num(it.oldPrice);
    $('#cDold').hidden = !(p !== '' && old !== '');
    if (old !== '') $('#cDold').textContent = '原价 ¥' + fmt(old);
    var bits = [it.cat || '未分类'];
    if (num(it.stock) !== '') bits.push('库存 ' + Number(it.stock) + ' 件');
    bits.push(it.sold ? '已售' : '在售');
    $('#cLine').textContent = bits.join(' · ');
    $('#cDesc').hidden = !it.desc;
    $('#cDesc').textContent = it.desc || '';
    $('#cNote').textContent = imgs.length ? '共 ' + imgs.length + ' 张图片' : '暂无图片';
  }
  function step(d) {
    var it = find(cur);
    if (!it) return;
    var n = (it.images || []).length;
    if (n < 2) return;
    idx = (idx + d + n) % n;
    renderDetail();
  }
  function openDetail(id) {
    var it = find(id);
    if (!it) return;
    cur = id;
    idx = 0;
    renderDetail();
    $('#cVeil').classList.add('on');
    $('#cView').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDetail() {
    $('#cView').classList.remove('open');
    $('#cVeil').classList.remove('on');
    document.body.style.overflow = '';
    cur = null;
  }
  function copyTextOf(it) {
    var lines = [it.title];
    if (num(it.price) === '') lines.push('价格：面议');
    else lines.push('价格：¥' + fmt(it.price) + (num(it.oldPrice) !== '' ? '（原价 ¥' + fmt(it.oldPrice) + '）' : ''));
    var meta = [];
    if (it.cat) meta.push('分类：' + it.cat);
    if (num(it.stock) !== '') meta.push('库存：' + Number(it.stock) + ' 件');
    if (meta.length) lines.push(meta.join('｜'));
    if (it.sold) lines.push('状态：已售');
    if (it.desc) { lines.push(''); lines.push(it.desc); }
    if (D.wx) { lines.push(''); lines.push('微信：' + D.wx); }
    return lines.join('\n');
  }
  document.title = (D.shop || '商品目录') + ' · 商品目录';
  $('#cShop').textContent = D.shop || '商品目录';
  var soldN = items.filter(function (i) { return i.sold; }).length;
  $('#cSub').textContent = '在售 ' + (items.length - soldN) + ' 件' + (soldN ? ' · 已售 ' + soldN + ' 件' : '');
  var QR = typeof D.qr === 'string' && D.qr.indexOf('data:image') === 0 ? D.qr : '';
  function openQr() {
    if (QR) { $('#cQrImg').src = QR; $('#cQrImg').hidden = false; $('#cQrHint').hidden = false; }
    else { $('#cQrImg').hidden = true; $('#cQrHint').hidden = true; }
    if (D.wx) { $('#cQrWx').textContent = D.wx; $('#cQrWxRow').hidden = false; $('#cQrCopy').hidden = false; }
    else { $('#cQrWxRow').hidden = true; $('#cQrCopy').hidden = true; }
    $('#cQrVeil').classList.add('on');
    $('#cQr').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeQr() {
    $('#cQr').classList.remove('open');
    $('#cQrVeil').classList.remove('on');
    document.body.style.overflow = $('#cView').classList.contains('open') ? 'hidden' : '';
  }
  function askWx() {
    if (QR) { openQr(); return; }
    if (D.wx) { copyText(String(D.wx), '微信号已复制，去微信加好友'); return; }
    toast('店主还没留联系方式');
  }
  if (D.wx || QR) {
    $('#cWx').hidden = false;
    $('#cAsk').hidden = false;
    if (D.wx) $('#cWxId').textContent = D.wx; else $('#cWxId').hidden = true;
    $('#cWx').addEventListener('click', askWx);
    $('#cAsk').addEventListener('click', askWx);
    $('#cQrX').addEventListener('click', closeQr);
    $('#cQrVeil').addEventListener('click', closeQr);
    $('#cQrCopy').addEventListener('click', function () {
      if (D.wx) copyText(String(D.wx), '微信号已复制，去微信加好友');
    });
  }
  var selfCv = null;
  function pageUrl() {
    var p = location.protocol;
    return (p === 'http:' || p === 'https:') ? location.href.split('#')[0] : '';
  }
  function makeQr(text, px) {
    var q = qrcode(0, 'M');
    q.addData(text);
    q.make();
    var n = q.getModuleCount(), border = 4;
    var cell = Math.max(2, Math.floor(px / (n + border * 2)));
    var size = (n + border * 2) * cell;
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#141210';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (q.isDark(r, c)) ctx.fillRect((c + border) * cell, (r + border) * cell, cell, cell);
      }
    }
    return cv;
  }
  function openSelf() {
    var u = pageUrl();
    if (!u) { toast('本地文件没有网址，二维码需要有网页地址'); return; }
    selfCv = makeQr(u, 660);
    $('#cSelfImg').src = selfCv.toDataURL('image/png');
    $('#cSelfVeil').classList.add('on');
    $('#cSelf').classList.add('open');
  }
  function closeSelf() {
    $('#cSelf').classList.remove('open');
    $('#cSelfVeil').classList.remove('on');
  }
  function saveSelf() {
    if (!selfCv) return;
    selfCv.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (D.shop || '相册').replace(/[\/:*?"<>|]/g, '') + '-二维码.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('二维码图片已保存');
    }, 'image/png');
  }
  $('#cGrid').addEventListener('click', function (e) {
    var c = e.target.closest('.c-card');
    if (c) openDetail(c.getAttribute('data-id'));
  });
  $('#cGrid').addEventListener('keydown', function (e) {
    var c = e.target.closest('.c-card');
    if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(c.getAttribute('data-id')); }
  });
  $('#cChips').addEventListener('click', function (e) {
    var b = e.target.closest('.c-chip');
    if (!b) return;
    cat = b.getAttribute('data-cat');
    render();
  });
  $('#cSearch').addEventListener('input', function (e) { q = e.target.value; render(); });
  $('#cBack').addEventListener('click', closeDetail);
  $('#cVeil').addEventListener('click', closeDetail);
  $('#cThs').addEventListener('click', function (e) {
    var t = e.target.closest('.c-th');
    if (!t) return;
    idx = Number(t.getAttribute('data-i'));
    renderDetail();
  });
  $('#cCopy').addEventListener('click', function () {
    var it = find(cur);
    if (it) copyText(copyTextOf(it), '商品信息已复制');
  });
  var sx = null;
  $('#cStage').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $('#cStage').addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if (Math.abs(dx) > 42) step(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('#cSelf').classList.contains('open')) { closeSelf(); return; }
      if ($('#cQr').classList.contains('open')) { closeQr(); return; }
      closeDetail(); return;
    }
    if (cur && e.key === 'ArrowLeft') step(-1);
    if (cur && e.key === 'ArrowRight') step(1);
  });
  if (pageUrl()) { $('#cSelfQr').hidden = false; }
  $('#cSelfQr').addEventListener('click', openSelf);
  $('#cSelfX').addEventListener('click', closeSelf);
  $('#cSelfVeil').addEventListener('click', closeSelf);
  $('#cSelfSave').addEventListener('click', saveSelf);
  render();
})();

</script>
</body>
</html>
